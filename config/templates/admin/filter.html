{% load i18n %}
<details data-filter-title="{{ title }}">
  <summary>
    <span>{{ title|capfirst }}</span>
    {% for choice in choices %}{% if choice.selected %}<span class="bru-filter-value">{{ choice.display }}</span>{% endif %}{% endfor %}
  </summary>
  <ul>
    {% for choice in choices %}
      <li{% if choice.selected %} class="selected"{% endif %}>
        <a href="{{ choice.query_string|iriencode }}"{% if choice.selected %} aria-current="true"{% endif %}>{{ choice.display }}</a>
      </li>
    {% endfor %}
  </ul>
</details>

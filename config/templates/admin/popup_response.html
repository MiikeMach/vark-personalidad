{% load i18n %}
<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'es-mx' }}">
<head>
  <meta charset="utf-8">
  <title>{% translate "Popup closing…" %}</title>
</head>
<body>
  <script id="django-admin-popup-response-constants" data-popup-response="{{ popup_response_data }}"></script>
  <script>
    const response = JSON.parse(document.getElementById("django-admin-popup-response-constants").dataset.popupResponse);
    window.parent.postMessage({
      type: "brujuela-admin-popup-response",
      action: response.action || "add",
      value: response.value,
      obj: response.obj,
      new_value: response.new_value,
      name: window.name
    }, window.location.origin);
  </script>
</body>
</html>
